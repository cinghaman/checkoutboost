<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Share Card</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<!--
  1200x675 share image in the App Store listing's style. Render with headless Chrome:
  "Google Chrome" --headless=new --window-size=1200,675 --screenshot=out.png \
    "file://…/og-card.html?eyebrow=…&title=…&accent=…&tag=…&plan=every|plus"
  `accent` is a word or phrase inside `title` to colour violet.
-->
<style>
	* { margin: 0; box-sizing: border-box; }
	body {
		width: 1200px; height: 675px; overflow: hidden; font-family: Inter, sans-serif; color: #17132b;
		background: radial-gradient(900px 560px at 96% -12%, #e6ddff 0%, rgba(230,221,255,0) 62%), #f5f3ee;
		padding: 64px 72px; display: flex; flex-direction: column;
	}
	.brand { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 22px; }
	.brand img { width: 46px; }
	.eyebrow { margin-top: 60px; font-weight: 700; font-size: 18px; letter-spacing: .08em; text-transform: uppercase; color: #6e6983; }
	h1 { margin-top: 18px; font-family: "Bricolage Grotesque", Inter, sans-serif; font-weight: 800; font-size: 72px; line-height: .98; letter-spacing: -0.03em; max-width: 1000px; }
	h1 em { font-style: normal; color: #6d4aff; }
	.foot { margin-top: auto; display: flex; gap: 12px; }
	.tag { padding: 10px 18px; border-radius: 999px; font-weight: 700; font-size: 16px; letter-spacing: .06em; text-transform: uppercase; }
	.every { color: #0f8a5f; background: #dcf5ea; }
	.plus { color: #9a5b00; background: #fdf0d5; }
	.site { color: #4a4560; background: #fff; box-shadow: inset 0 0 0 1.5px #ddd8e8; }
</style>
</head>
<body>
	<div class="brand"><img src="../images/logo-mark.svg" alt="">Smart Checkout Widgets</div>
	<div class="eyebrow" id="eyebrow"></div>
	<h1 id="title"></h1>
	<div class="foot"><span class="tag" id="tag"></span><span class="tag site">smartcheckoutwidgets.com</span></div>
	<script>
		const p = new URLSearchParams(location.search);
		const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
		document.getElementById('eyebrow').textContent = p.get('eyebrow') || '';
		const title = esc(p.get('title') || ''), accent = esc(p.get('accent') || '');
		document.getElementById('title').innerHTML = accent ? title.replace(accent, '<em>' + accent + '</em>') : title;
		const tag = document.getElementById('tag');
		tag.textContent = p.get('tag') || '';
		tag.className = 'tag ' + (p.get('plan') === 'plus' ? 'plus' : 'every');
		if (!p.get('tag')) tag.remove();
	</script>
</body>
</html>
